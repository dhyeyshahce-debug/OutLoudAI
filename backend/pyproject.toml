[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "YugShah2125", email = "yugshah.ce@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "gliner>=0.2.29",
    "protobuf>=7.36.2",
    "faster-whisper>=1.2.1",
    "numpy>=2.2.6",
    "psycopg2-binary>=2.9.12",
    "pydub>=0.25.1",
    "python-dotenv>=1.2.3",
    "sentence-transformers>=6.1.0",
    "spacy>=3.8.16",
    "soundfile>=0.14.0",
    "sqlmodel>=0.0.42",
    "tiktoken>=0.14.0",
    "torch>=2.14.1",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
